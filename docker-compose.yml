services:

  postgres:
    image: postgres:16
    container_name: cogniops-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-cogniops}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cogniops}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cogniops-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cogniops}

      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      CHROMA_PERSIST_DIRECTORY: /app/chroma_data
      AUTO_AI_ANALYSIS: ${AUTO_AI_ANALYSIS:-true}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    volumes:
      - ./backend/chroma_data:/app/chroma_data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: cogniops-frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"

volumes:
  postgres_data: